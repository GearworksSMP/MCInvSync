name: Build and Release (master + 1.20.1)

on:
  push:
    branches:
      - master
      - 1.20.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: ./gradlew remapJar

      - name: Locate release jar
        id: jar
        shell: bash
        run: |
          JAR=$(ls -1 build/libs/invsync-*.jar | grep -Ev '(sources|javadoc|dev)' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No release jar found in build/libs"
            ls -la build/libs || true
            exit 1
          fi
          echo "jar_path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload jar artifact (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: invsync-${{ github.ref_name }}-build
          path: ${{ steps.jar.outputs.jar_path }}

      - name: Create GitHub release and upload jar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.ref_name }}-${{ github.run_number }}-${{ github.sha }}
          name: Build (${{ github.ref_name }}) #${{ github.run_number }}
          body: |
            Automated build from `${{ github.ref_name }}`.

            Commit: `${{ github.sha }}`
          files: ${{ steps.jar.outputs.jar_path }}
          draft: false
          prerelease: true
